name: enterprise-rag-production

x-app-environment: &app-environment
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
  # This credential is accepted only by /api/v1/assistant/* and must remain
  # server-side. Compose fails before starting any app container if it is absent.
  ASSISTANT_SERVICE_TOKEN: ${ASSISTANT_SERVICE_TOKEN:?ASSISTANT_SERVICE_TOKEN is required}
  ASSISTANT_SERVICE_TOKEN_PREVIOUS: ${ASSISTANT_SERVICE_TOKEN_PREVIOUS:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:18080}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rag_platform}
  REQUIRED_POSTGRES_EXTENSIONS: vector,pg_search
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  RQ_INDEX_JOB_TIMEOUT_SECONDS: ${RQ_INDEX_JOB_TIMEOUT_SECONDS:-7200}
  RQ_MAINTENANCE_JOB_TIMEOUT_SECONDS: ${RQ_MAINTENANCE_JOB_TIMEOUT_SECONDS:-7200}
  ASSISTANT_REQUEST_RETENTION_DAYS: ${ASSISTANT_REQUEST_RETENTION_DAYS:-7}
  # Stale RUNNING Assistant requests are auto-failed by the maintenance worker.
  ASSISTANT_REQUEST_STALE_SECONDS: ${ASSISTANT_REQUEST_STALE_SECONDS:-600}
  # Process-wide chat turn admission gate (0 disables).
  CHAT_TURN_CONCURRENCY_LIMIT: ${CHAT_TURN_CONCURRENCY_LIMIT:-64}
  CHAT_TURN_WAIT_SECONDS: ${CHAT_TURN_WAIT_SECONDS:-2.0}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_SECURE: "false"
  MINIO_DOCUMENT_BUCKET: ${MINIO_DOCUMENT_BUCKET:-rag-documents}
  MINIO_IMAGE_BUCKET: ${MINIO_IMAGE_BUCKET:-rag-images}
  # Required to decrypt provider API keys persisted in model_config.
  MODEL_SECRET_KEY: ${MODEL_SECRET_KEY:?MODEL_SECRET_KEY is required}
  MODEL_SECRET_KEY_VERSION: ${MODEL_SECRET_KEY_VERSION:-1}
  MODEL_PROBE_TIMEOUT_SECONDS: ${MODEL_PROBE_TIMEOUT_SECONDS:-15.0}
  EMBEDDING_DIMENSION: "1024"
  SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
  ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/}
  M2_EMBEDDING_PROVIDER: ${M2_EMBEDDING_PROVIDER:-auto}
  M3_LLM_PROVIDER: ${M3_LLM_PROVIDER:-auto}
  M3_CONTEXT_MAX_CHUNKS: ${M3_CONTEXT_MAX_CHUNKS:-8}
  M3_TURN_DEADLINE_SECONDS: ${M3_TURN_DEADLINE_SECONDS:-90.0}
  M3_RAG_FULL_DOCUMENT_LIMIT: ${M3_RAG_FULL_DOCUMENT_LIMIT:-3}
  M3_RAG_FULL_CONTEXT_TOKEN_BUDGET: ${M3_RAG_FULL_CONTEXT_TOKEN_BUDGET:-20000}
  M3_RAG_ANSWER_MAX_TOKENS: ${M3_RAG_ANSWER_MAX_TOKENS:-4096}
  M3_RAG_ANSWER_TIMEOUT_SECONDS: ${M3_RAG_ANSWER_TIMEOUT_SECONDS:-45.0}
  M3_RAG_ANSWER_THINKING_ENABLED: ${M3_RAG_ANSWER_THINKING_ENABLED:-false}
  M3_RAG_ANSWER_THINKING_BUDGET: ${M3_RAG_ANSWER_THINKING_BUDGET:-2048}
  M3_RAG_HISTORY_MAX_ROUNDS: ${M3_RAG_HISTORY_MAX_ROUNDS:-4}
  M3_RAG_ANSWER_REPAIR_ATTEMPTS: ${M3_RAG_ANSWER_REPAIR_ATTEMPTS:-1}
  M3_RAG_SCOPE_MAX_TOKENS: ${M3_RAG_SCOPE_MAX_TOKENS:-800}
  M3_RAG_QUERY_INTERPRETER_MAX_TOKENS: ${M3_RAG_QUERY_INTERPRETER_MAX_TOKENS:-512}
  M3_RAG_QUERY_INTERPRETER_TIMEOUT_SECONDS: ${M3_RAG_QUERY_INTERPRETER_TIMEOUT_SECONDS:-15.0}
  M3_RAG_QUERY_VARIANT_LIMIT: ${M3_RAG_QUERY_VARIANT_LIMIT:-3}
  M3_RAG_DOCUMENT_CARD_TOP_K: ${M3_RAG_DOCUMENT_CARD_TOP_K:-5}
  # Support document-routing thresholds. Support is retained but frozen.
  M3_DOC_LOCK_BEST_FLOOR: ${M3_DOC_LOCK_BEST_FLOOR:-0.70}
  M3_DOC_SINGLE_CLARIFY_BEST_FLOOR: ${M3_DOC_SINGLE_CLARIFY_BEST_FLOOR:-0.65}
  M3_QUERY_EMBEDDING_TIMEOUT_SECONDS: ${M3_QUERY_EMBEDDING_TIMEOUT_SECONDS:-10.0}
  M3_QUERY_EMBEDDING_RETRIES: ${M3_QUERY_EMBEDDING_RETRIES:-1}
  M3_RERANK_TIMEOUT_SECONDS: ${M3_RERANK_TIMEOUT_SECONDS:-15.0}
  M4_OCR_PROVIDER: ${M4_OCR_PROVIDER:-auto}
  M4_VISION_PROVIDER: ${M4_VISION_PROVIDER:-auto}
  M4_IMAGE_CONCURRENCY: ${M4_IMAGE_CONCURRENCY:-8}
  M5_RERANK_PROVIDER: ${M5_RERANK_PROVIDER:-auto}

services:
  postgres:
    image: paradedb/paradedb:0.25.0-pg17@sha256:6a334b612cadfeb92c416ecf3816dd9a277c10976e2e931e2c33f7289867c7c9
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_platform}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/001-extensions.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.8.1-trixie
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_DOCUMENT_BUCKET: ${MINIO_DOCUMENT_BUCKET:-rag-documents}
      MINIO_IMAGE_BUCKET: ${MINIO_IMAGE_BUCKET:-rag-images}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_DOCUMENT_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_IMAGE_BUCKET}"
        mc anonymous set none "local/$${MINIO_DOCUMENT_BUCKET}"
        mc anonymous set none "local/$${MINIO_IMAGE_BUCKET}"
    restart: "no"

  migrate:
    image: ${BACKEND_IMAGE:-enterprise-rag-backend:1.0.1}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-enterprise-rag-backend:1.0.1}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-environment
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${BACKEND_WORKERS:-2} $${BACKEND_LIMIT_CONCURRENCY:+--limit-concurrency $${BACKEND_LIMIT_CONCURRENCY}}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  worker-index:
    image: ${BACKEND_IMAGE:-enterprise-rag-backend:1.0.1}
    environment:
      <<: *app-environment
      RQ_QUEUES: index_build
      RQ_WORKER_NAME: rag-index-worker
    command: ["rag-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  worker-maintenance:
    image: ${BACKEND_IMAGE:-enterprise-rag-backend:1.0.1}
    environment:
      <<: *app-environment
      RQ_QUEUES: ingestion,maintenance
      RQ_WORKER_NAME: rag-maintenance-worker
    command: ["rag-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-enterprise-rag-frontend:1.0.1}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Listen on all host interfaces for cross-server intranet access;
      # restrict this port to approved source addresses at the host firewall.
      - "${APP_HTTP_BIND_ADDRESS:-0.0.0.0}:${APP_HTTP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
